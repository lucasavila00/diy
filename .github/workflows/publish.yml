name: Publish Package to npmjs
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --dir packages/diy pack --out "$RUNNER_TEMP/diy.tgz"
          pnpm --dir packages/diy-cli pack --out "$RUNNER_TEMP/diy-cli.tgz"
      - name: Publish with OIDC
        run: |
          npm publish "$RUNNER_TEMP/diy.tgz" --access public
          npm publish "$RUNNER_TEMP/diy-cli.tgz" --access public
