name: Publish Package to npmjs
on:
  release:
    types: [created]
  # Manual re-run from main, e.g. to finish a release where one package failed.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --dir packages/diy pack --out "$RUNNER_TEMP/diy.tgz"
          pnpm --dir packages/diy-cli pack --out "$RUNNER_TEMP/diy-cli.tgz"
      - name: Publish with OIDC
        run: |
          # Skip versions already on npm so a partially failed release can be re-run.
          for package in diy diy-cli; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              npm publish "$RUNNER_TEMP/$package.tgz" --access public
            fi
          done
